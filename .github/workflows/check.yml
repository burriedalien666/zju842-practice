name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:connection-ui
      - run: npm run test:update-ui-review
      - run: npm run test:update-content-ui
      - run: npm run test:author-answers
      - run: npm run test:video-ui
      - run: npm run test:post-update-ui
      - run: npm run test:practice-ui
      - run: npm run test:image-regression-ui
      - run: npm run test:progress-switch-ui
      - run: npm run test:completion-ui
      - run: node scripts/test-reader-polish-ui.js
      - run: node scripts/test-structured-ui.js
      - name: Test source ZIP after clean extraction
        shell: bash
        run: |
          node scripts/package-source.js "$RUNNER_TEMP/zju842-source.zip"
          mkdir "$RUNNER_TEMP/zju842-source-check"
          unzip -q "$RUNNER_TEMP/zju842-source.zip" -d "$RUNNER_TEMP/zju842-source-check"
          cd "$RUNNER_TEMP/zju842-source-check/zju842-source"
          npm ci
          npm run build
          npm test
          npm run test:update-ui-review
          npm run test:video-ui
          npm run test:completion-ui
      - run: npm audit --omit=dev --audit-level=high
      - name: Build container
        run: docker build --tag zju842-test .
      - name: Test container and persistent volume
        run: node scripts/check-container.js
