name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:connection-ui
      - run: npm audit --omit=dev --audit-level=high
      - name: Build container
        run: docker build --tag zju842-test .
      - name: Test container and persistent volume
        run: node scripts/check-container.js
