name: Publish verified desktop release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Desktop packages run ID
        required: true
      revision:
        description: Commit tested by that run
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Verify the tested revision
        run: |
          gh run view "$RUN_ID" --json status,conclusion,headSha,workflowName > /tmp/desktop-run.json
          node -e 'const r=require("/tmp/desktop-run.json");if(r.status!=="completed"||r.conclusion!=="success"||r.headSha!==process.env.REVISION||r.workflowName!=="Desktop packages")process.exit(1)'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Read release version and notes
        run: |
          node --input-type=module -e 'import fs from "node:fs";const p=JSON.parse(fs.readFileSync("package.json"));if(!/^\d+\.\d+\.\d+$/.test(p.version))throw new Error("Invalid release version");const tag="v"+p.version;fs.accessSync("docs/releases/"+tag+".md");fs.appendFileSync(process.env.GITHUB_ENV,"RELEASE_TAG="+tag+"\n");'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true
      - run: npm ci
      - name: Prepare the independent library package
        run: |
          node --input-type=module -e 'import fs from "node:fs";import path from "node:path";import {writeZip,packPaths} from "./server/packs.js";const c=JSON.parse(fs.readFileSync("public/catalog.json"));c.edition="2026-09-17";await writeZip("release-assets/zju842-library-2026-09-17.842pack",[{name:"catalog.json",bytes:Buffer.from(JSON.stringify(c))},...[...packPaths(c)].filter(p=>p!=="catalog.json").map(p=>({name:p,file:path.resolve("public",p)}))]);'
      - name: Verify package contents
        run: |
          python - <<'PY'
          import json,pathlib,zipfile
          version=json.loads(pathlib.Path('package.json').read_text())['version']
          assets=list(pathlib.Path('release-assets').glob('*.zip'))
          expected={f'zju842-{version}-{platform}.zip' for platform in ['windows-x64','macos-x64','macos-arm64']}
          assert {f.name for f in assets}==expected,assets
          for file in assets:
              with zipfile.ZipFile(file) as archive:
                  names=archive.namelist()
                  assert any(n.endswith('/server/desktop.js') for n in names)
                  assert not any('/.env' in n or '/userdata/' in n or '/data/admin-access' in n or n.endswith('.pdf') for n in names)
                  package=json.loads(archive.read(file.stem+'/package.json'))
                  assert package['version']==version,file.name
                  print(file.name,round(file.stat().st_size/1048576,2),'MiB')
          PY
      - name: Publish release
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/*.842pack --draft --target "$REVISION" --title "$(head -n 1 "docs/releases/$RELEASE_TAG.md" | sed 's/^# //')" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
